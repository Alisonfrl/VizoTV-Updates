name: Publicar Vizo TV 10.28
on:
  push:
    paths: ['.github/workflows/publicar-10.28.yml']
permissions:
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verificar APK
        run: |
          echo "51960629b1cb805d13c87b7150d89be004d709c70fab58cebe81ab445012ba57  publicar/VizoTV-10.28.apk" | sha256sum -c -
          printf '%s\n' "51960629b1cb805d13c87b7150d89be004d709c70fab58cebe81ab445012ba57  VizoTV-10.28.apk" > /tmp/SHA256SUMS.txt
      - name: Publicar release, ativar manifesto e limpar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v10.28 publicar/VizoTV-10.28.apk /tmp/SHA256SUMS.txt --title "Vizo TV 10.28" --notes-file NOTAS-10.28.txt
          cp update-next.json update.json
          git rm -q -r publicar update-next.json .github/workflows/publicar-10.28.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json
          git commit -m "Ativa manifesto 10.28 e remove arquivos temporários"
          git push origin HEAD:main
