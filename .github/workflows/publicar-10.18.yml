name: Publicar Vizo TV 10.18
on:
  push:
    paths: ['.github/workflows/publicar-10.18.yml']
permissions:
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Obter pacote de distribuição revisado
        env:
          DOWNLOAD_URL: 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-79bc-820e-a551-b0668d492f38/raw?se=2026-11-02T02%3A55%3A28Z&sp=r&sv=2026-02-06&sr=b&scid=bebfedcd-0c38-4286-ac8e-9bddcac71cec&skoid=db6dad9e-03ee-465b-aef6-ce0f63a161dc&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-01T22%3A50%3A22Z&ske=2026-11-02T22%3A50%3A22Z&sks=b&skv=2026-02-06&sig=FJZxjrmtfagVXCRjmcM4WthJvA/nq2wfDUZuz7aNYUI%3D'
        run: |
          curl --fail --silent --show-error --location --max-time 90 "$DOWNLOAD_URL" -o /tmp/vizo.zip
          unzip -p /tmp/vizo.zip build/VizoTV-VisualLab-10.18.apk > /tmp/VizoTV-10.18.apk
          echo "7b81d0b9ce4ba591816607eda549b973764d3a3bee55aadfb2e2b2368b2b1fb5  /tmp/VizoTV-10.18.apk" | sha256sum -c -
          printf '%s\n' "7b81d0b9ce4ba591816607eda549b973764d3a3bee55aadfb2e2b2368b2b1fb5  VizoTV-10.18.apk" > /tmp/SHA256SUMS.txt
      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v10.18 /tmp/VizoTV-10.18.apk /tmp/SHA256SUMS.txt --title "Vizo TV 10.18" --notes-file NOTAS-10.18.txt
