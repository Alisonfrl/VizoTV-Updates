name: Publicar Vizo TV 10.21
on:
  push:
    paths: ['.github/workflows/publicar-10.21.yml']
permissions:
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Obter APK e verificar
        env:
          DOWNLOAD_URL: 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-fd00-820e-a7bb-9d38a6e7f831/raw?se=2026-11-02T03%3A37%3A38Z&sp=r&sv=2026-02-06&sr=b&scid=1dc55ee1-6f09-4e54-90cb-2d8ce9d9a45e&skoid=db6dad9e-03ee-465b-aef6-ce0f63a161dc&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-01T23%3A59%3A58Z&ske=2026-11-02T23%3A59%3A58Z&sks=b&skv=2026-02-06&sig=n6fYzxB3xk3/ZRjDyKs49JP2hakzJWcYMKuGnocFEnM%3D'
        run: |
          curl --fail --silent --show-error --location --max-time 90 "$DOWNLOAD_URL" -o /tmp/vizo.zip
          unzip -p /tmp/vizo.zip build/VizoTV-VisualLab-10.21.apk > /tmp/VizoTV-10.21.apk
          echo "08b3b92cdc0e35fba13619a55119bd0d34d983b5b336ef40266549ed2174b35e  /tmp/VizoTV-10.21.apk" | sha256sum -c -
          printf '%s\n' "08b3b92cdc0e35fba13619a55119bd0d34d983b5b336ef40266549ed2174b35e  VizoTV-10.21.apk" > /tmp/SHA256SUMS.txt
      - name: Publicar release e manifesto
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v10.21 /tmp/VizoTV-10.21.apk /tmp/SHA256SUMS.txt --title "Vizo TV 10.21" --notes-file NOTAS-10.21.txt
          cp update-next.json update.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json
          git commit -m "Ativa manifesto 10.21"
          git push origin HEAD:main
