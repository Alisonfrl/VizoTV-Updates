name: Publicar Vizo TV 10.22
on:
  push:
    paths: ['.github/workflows/publicar-10.22.yml']
permissions:
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Obter APK e verificar
        env:
          DOWNLOAD_URL: 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-8f64-820e-9709-eafddb87ef12/raw?se=2026-11-02T03%3A56%3A21Z&sp=r&sv=2026-02-06&sr=b&scid=1e097e2b-24c5-4416-b19e-5b6f71ed955f&skoid=db6dad9e-03ee-465b-aef6-ce0f63a161dc&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-01T13%3A25%3A39Z&ske=2026-11-02T13%3A25%3A39Z&sks=b&skv=2026-02-06&sig=f11TmI7ChABpZ0FRooQhJb3udOTxsEwVT2FFssyggpc%3D'
        run: |
          curl --fail --silent --show-error --location --max-time 90 "$DOWNLOAD_URL" -o /tmp/vizo.zip
          unzip -p /tmp/vizo.zip build/VizoTV-VisualLab-10.22.apk > /tmp/VizoTV-10.22.apk
          echo "3b1ddf5bc2357c6f0a5651bba41aac01a084f5dd7df695a7a8ecb2c49e6f9e20  /tmp/VizoTV-10.22.apk" | sha256sum -c -
          printf '%s\n' "3b1ddf5bc2357c6f0a5651bba41aac01a084f5dd7df695a7a8ecb2c49e6f9e20  VizoTV-10.22.apk" > /tmp/SHA256SUMS.txt
      - name: Publicar release e manifesto
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v10.22 /tmp/VizoTV-10.22.apk /tmp/SHA256SUMS.txt --title "Vizo TV 10.22" --notes-file NOTAS-10.22.txt
          cp update-next.json update.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json
          git commit -m "Ativa manifesto 10.22"
          git push origin HEAD:main
