name: Publicar Vizo TV 10.20
on:
  push:
    paths: ['.github/workflows/publicar-10.20.yml']
permissions:
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Obter APK revisado
        env:
          DOWNLOAD_URL: 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-c388-820e-aa27-0ab358a07a62/raw?se=2026-11-02T03%3A21%3A28Z&sp=r&sv=2026-02-06&sr=b&scid=f35670ce-94ba-45ff-9ea5-4f27500ee89c&skoid=db6dad9e-03ee-465b-aef6-ce0f63a161dc&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-01T23%3A40%3A39Z&ske=2026-11-02T23%3A40%3A39Z&sks=b&skv=2026-02-06&sig=jnXl8fyZuUMYwhYC/S3F6aY4m867nHMhVhE04d1BfI8%3D'
        run: |
          curl --fail --silent --show-error --location --max-time 90 "$DOWNLOAD_URL" -o /tmp/vizo.zip
          unzip -p /tmp/vizo.zip build/VizoTV-VisualLab-10.20.apk > /tmp/VizoTV-10.20.apk
          echo "27e3b71a1671ccf2e13deb2fd6a3ee9a7784f7b5d105f4932257f65bbfd2b681  /tmp/VizoTV-10.20.apk" | sha256sum -c -
          printf '%s\n' "27e3b71a1671ccf2e13deb2fd6a3ee9a7784f7b5d105f4932257f65bbfd2b681  VizoTV-10.20.apk" > /tmp/SHA256SUMS.txt
      - name: Publicar release e atualizar manifesto
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v10.20 /tmp/VizoTV-10.20.apk /tmp/SHA256SUMS.txt --title "Vizo TV 10.20" --notes-file NOTAS-10.20.txt
          cp update-next.json update.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json
          git commit -m "Ativa manifesto 10.20"
          git push origin HEAD:main
