name: Publicar Vizo TV 10.26
on:
  push:
    paths: ['.github/workflows/publicar-10.26.yml']
permissions:
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verificar APK
        run: |
          echo "74f2a96b0254793ed463dace53380d3cb9a4587eaccd47c45cccfc767c06583d  publicar/VizoTV-10.26.apk" | sha256sum -c -
          printf '%s\n' "74f2a96b0254793ed463dace53380d3cb9a4587eaccd47c45cccfc767c06583d  VizoTV-10.26.apk" > /tmp/SHA256SUMS.txt
      - name: Publicar release, ativar manifesto e limpar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v10.26 publicar/VizoTV-10.26.apk /tmp/SHA256SUMS.txt --title "Vizo TV 10.26" --notes-file NOTAS-10.26.txt
          cp update-next.json update.json
          git rm -q -r publicar update-next.json .github/workflows/publicar-10.26.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json
          git commit -m "Ativa manifesto 10.26 e remove arquivos temporários"
          git push origin HEAD:main
