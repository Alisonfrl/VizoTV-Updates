name: Publicar Vizo TV 10.27
on:
  push:
    paths: ['.github/workflows/publicar-10.27.yml']
permissions:
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verificar APK
        run: |
          echo "c470c3938db144fa3a7867d9926120d67183dc1929c1b3874ae61b4fbf059fea  publicar/VizoTV-10.27.apk" | sha256sum -c -
          printf '%s\n' "c470c3938db144fa3a7867d9926120d67183dc1929c1b3874ae61b4fbf059fea  VizoTV-10.27.apk" > /tmp/SHA256SUMS.txt
      - name: Publicar release, ativar manifesto e limpar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v10.27 publicar/VizoTV-10.27.apk /tmp/SHA256SUMS.txt --title "Vizo TV 10.27" --notes-file NOTAS-10.27.txt
          cp update-next.json update.json
          git rm -q -r publicar update-next.json .github/workflows/publicar-10.27.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json
          git commit -m "Ativa manifesto 10.27 e remove arquivos temporários"
          git push origin HEAD:main
